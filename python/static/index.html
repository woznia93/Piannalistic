<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E9EDF2;
    --panel: #F7F9FB;
    --ink: #16223A;
    --muted: #5E6C86;
    --rule: #CCD4DF;
    --buy: #0B8A7E;
    --sell: #C7364E;
    --vwap: #B97F00;
    --font: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1A2D;
      --panel: #142339;
      --ink: #E8EEF7;
      --muted: #8C9BB6;
      --rule: #263852;
      --buy: #35C2B1;
      --sell: #F26D82;
      --vwap: #F0B23E;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.4 var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .page { max-width: 1320px; margin: 0 auto; padding: 16px 20px 28px; }

  /* ---------- top bar ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 14px; }
  .bar h1 { font-size: 20px; font-weight: 600; letter-spacing: .01em; margin: 0; }
  .tabs, .ranges { display: flex; gap: 2px; }
  .tabs button, .ranges button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 6px 10px 5px; cursor: pointer; color: var(--muted); font-weight: 500;
  }
  .tabs button[aria-pressed="true"], .ranges button[aria-pressed="true"] {
    color: var(--ink); border-bottom-color: var(--ink);
  }
  .tabs button:hover, .ranges button:hover { color: var(--ink); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.live i { background: var(--buy); }
  .status.down i { background: var(--sell); }

  /* ---------- layout ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }

  /* ---------- chart panel ---------- */
  .chart-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 14px 16px 6px; }
  .price { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
  .gap { font-size: 17px; font-weight: 500; }
  .when { color: var(--muted); font-size: 15px; }
  .legend { margin-left: auto; display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .l-price::before { content: ""; width: 18px; border-top: 2px solid var(--ink); }
  .legend .l-vwap::before { content: ""; width: 18px; border-top: 2px dashed var(--vwap); }
  .canvas-wrap { position: relative; height: 650px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); padding: 24px; text-align: center;
  }
  .empty[hidden] { display: none; }

  /* ---------- side column ---------- */
  .side { display: grid; gap: 16px; }
  .gauges { padding: 4px 16px 6px; }
  .gauge { padding: 12px 0 14px; border-bottom: 1px solid var(--rule); }
  .gauge:last-child { border-bottom: 0; }
  .gauge header { display: flex; align-items: baseline; justify-content: space-between; }
  .gauge h2 { font-size: 16px; font-weight: 500; margin: 0; }
  .gauge output { font-size: 24px; font-weight: 600; }
  .track { position: relative; height: 14px; margin: 8px 0 5px; background: var(--paper); border-radius: 2px; overflow: hidden; }
  .track .fill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--buy); transition: left .25s, width .25s; }
  .track.two-sided::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid var(--ink); }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  .say { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .tiles { margin: 0; padding: 6px 16px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .tiles div { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .tiles div:nth-last-child(-n+2) { border-bottom: 0; }
  .tiles dt { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .tiles dd { margin: 0; font-size: 22px; font-weight: 600; }
  .tiles dd small { font-size: 14px; font-weight: 400; color: var(--muted); }

  .foot { margin: 14px 2px 0; color: var(--muted); font-size: 14px; }

  @media (max-width: 920px) {
    .grid { grid-template-columns: 1fr; }
    .side { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .page { padding: 12px 10px 20px; }
    .side { grid-template-columns: 1fr; }
    .status { margin-left: 0; width: 100%; order: 5; }
    .price { font-size: 32px; }
    .legend { margin-left: 0; width: 100%; }
    .canvas-wrap { height: 500px; }
  }
  @media (prefers-reduced-motion: reduce) { .track .fill { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1>Market analytics</h1>
    <div class="tabs" id="tabs" role="group" aria-label="Product"></div>
    <div class="ranges" id="ranges" role="group" aria-label="Time shown">
      <button data-range="120">2 min</button>
      <button data-range="600" aria-pressed="true">10 min</button>
      <button data-range="1800">30 min</button>
    </div>
    <div class="status" id="status" role="status"><i></i><span>Connecting</span></div>
  </div>

  <div class="grid">
    <section class="panel" aria-label="Price and metrics over time">
      <div class="chart-head">
        <div class="price" id="price">–</div>
        <div class="gap" id="gap"></div>
        <div class="when" id="when"></div>
        <div class="legend"><span class="l-price">Last trade</span><span class="l-vwap" id="l-vwap">VWAP</span></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="chart" aria-label="Price against VWAP with order flow, book pressure, volatility and VPIN on a shared time axis"></canvas>
        <div class="empty" id="empty">Waiting for the first trades.</div>
      </div>
    </section>

    <div class="side">
      <section class="panel gauges" aria-label="Current readings">
        <div class="gauge">
          <header><h2>Order flow</h2><output id="flow-v">–</output></header>
          <div class="track two-sided"><div class="fill" id="flow-f"></div></div>
          <div class="ends"><span>Sellers hitting bids</span><span>Buyers lifting offers</span></div>
          <p class="say" id="flow-s"></p>
        </div>
        <div class="gauge">
          <header><h2>Book pressure</h2><output id="book-v">–</output></header>
          <div class="track two-sided"><div class="fill" id="book-f"></div></div>
          <div class="ends"><span>More on the ask</span><span>More on the bid</span></div>
          <p class="say" id="book-s"></p>
        </div>
        <div class="gauge">
          <header><h2>Flow toxicity (VPIN)</h2><output id="vpin-v">–</output></header>
          <div class="track"><div class="fill" id="vpin-f" style="left:0;background:var(--ink)"></div></div>
          <div class="ends"><span>Two-sided</span><span>One-sided</span></div>
          <p class="say" id="vpin-s"></p>
        </div>
      </section>

      <dl class="panel tiles">
        <div><dt>Spread</dt><dd id="t-spread">–</dd></div>
        <div><dt>Volatility</dt><dd id="t-vol">–</dd></div>
        <div><dt>Trades per sec</dt><dd id="t-rate">–</dd></div>
        <div><dt id="t-volume-l">Volume</dt><dd id="t-volume">–</dd></div>
        <div><dt>Mid price</dt><dd id="t-mid">–</dd></div>
        <div><dt>Feed delay</dt><dd id="t-lag">–</dd></div>
      </dl>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const state = {
    data: {},          // product -> array of snapshots, oldest first
    active: null,
    range: 600,
    hoverT: null,
    meta: { window: 60, interval: 1, source: "", vpin_buckets: 50, host: "" },
    connected: false,
    ended: false,
    error: null,
  };
  const MAX_POINTS = 3600;

  // ---------- formatting ----------
  const fmtPrice = v => {
    if (!(v > 0)) return "–";
    const d = v >= 100 ? 2 : v >= 1 ? 4 : 6;
    return v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const fmtSigned = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
  const fmtQty = v => v >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 0 })
                    : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toPrecision(3);
  const fmtClock = (t, secs = true) => new Date(t * 1000).toLocaleTimeString([], {
    hour12: false, hour: "2-digit", minute: "2-digit", ...(secs ? { second: "2-digit" } : {}) });
  const pct = v => Math.round(v * 100) + "%";

  // ---------- theme colours for the canvas ----------
  let C = {};
  const readTheme = () => {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["paper", "panel", "ink", "muted", "rule", "buy", "sell", "vwap"])
      C[k] = cs.getPropertyValue("--" + k).trim();
    C.font = cs.getPropertyValue("--font").trim();
  };
  readTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); draw(); });

  // ---------- data helpers ----------
  const series = () => state.data[state.active] || [];
  const lowerBound = (arr, t) => {            // first index with arr[i].t >= t
    let lo = 0, hi = arr.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].t < t) lo = m + 1; else hi = m; }
    return lo;
  };
  const nearest = (arr, t) => {
    if (!arr.length) return null;
    const i = lowerBound(arr, t);
    if (i <= 0) return arr[0];
    if (i >= arr.length) return arr[arr.length - 1];
    return (t - arr[i - 1].t) < (arr[i].t - t) ? arr[i - 1] : arr[i];
  };
  const shown = () => {                       // the snapshot the readouts describe
    const d = series();
    if (!d.length) return null;
    return state.hoverT == null ? d[d.length - 1] : nearest(d, state.hoverT);
  };

  // ---------- side panel + header ----------
  const setTwoSided = (fillEl, v) => {
    const w = Math.min(Math.abs(v), 1) * 50;
    fillEl.style.width = w + "%";
    fillEl.style.left = (v >= 0 ? 50 : 50 - w) + "%";
    fillEl.style.background = v >= 0 ? "var(--buy)" : "var(--sell)";
  };
  const signColor = v => v > 0 ? "var(--buy)" : v < 0 ? "var(--sell)" : "var(--ink)";

  function renderPanels() {
    const s = shown();
    const win = state.meta.window;
    $("l-vwap").textContent = `VWAP, last ${win} s`;
    $("t-volume-l").textContent = `Volume, last ${win} s`;
    $("empty").hidden = !!s;
    if (!s) {
      $("empty").textContent = state.error ? `The feed stopped: ${state.error}`
        : state.connected ? "Waiting for the first trades."
        : "Not connected to the Pi. Retrying every 2 seconds.";
      return;
    }
    $("price").textContent = fmtPrice(s.last);
    if (s.vwap > 0) {
      const bp = (s.last / s.vwap - 1) * 1e4;
      $("gap").textContent = `${Math.abs(bp).toFixed(1)} bp ${bp >= 0 ? "above" : "below"} VWAP`;
      $("gap").style.color = signColor(bp);
    } else $("gap").textContent = "";
    $("when").textContent = (state.hoverT == null ? "as of " : "at ") + fmtClock(s.t);

    $("flow-v").textContent = fmtSigned(s.flow);
    $("flow-v").style.color = signColor(s.flow);
    setTwoSided($("flow-f"), s.flow);
    $("flow-s").textContent = `Buyers took ${pct((1 + s.flow) / 2)} of the volume traded in the last ${win} s.`;

    $("book-v").textContent = fmtSigned(s.book);
    $("book-v").style.color = signColor(s.book);
    setTwoSided($("book-f"), s.book);
    $("book-s").textContent = `The best bid holds ${pct((1 + s.book) / 2)} of the size quoted at the top of the book.`;

    if (s.vpin_n > 0) {
      $("vpin-v").textContent = s.vpin.toFixed(2);
      $("vpin-f").style.width = Math.min(s.vpin, 1) * 100 + "%";
      $("vpin-s").textContent = `Average imbalance across the last ${s.vpin_n} volume buckets of ${fmtQty(s.vpin_bucket)} each.`;
    } else {
      $("vpin-v").textContent = "–";
      $("vpin-f").style.width = "0";
      $("vpin-s").textContent = s.vpin_bucket > 0 ? "Bucket size is set. Filling the first bucket."
        : `Sizing buckets from the first ${win} s of trading.`;
    }

    $("t-spread").innerHTML = `${s.spread.toFixed(2)} <small>bp</small>`;
    $("t-vol").innerHTML = `${s.vol.toFixed(2)} <small>bp</small>`;
    $("t-rate").textContent = s.rate.toFixed(1);
    $("t-volume").textContent = fmtQty(s.volume);
    $("t-mid").textContent = fmtPrice(s.mid);
    $("t-lag").innerHTML = s.lag == null ? "–" : `${Math.max(0, s.lag)} <small>ms</small>`;
  }

  function renderStatus() {
    const el = $("status"), txt = el.querySelector("span");
    const names = { coinbase: "Live from Coinbase", synthetic: "Simulated market", replay: "Replaying a recording" };
    el.className = "status";
    if (!state.connected) { el.classList.add("down"); txt.textContent = "Connection lost, retrying"; }
    else if (state.error) { el.classList.add("down"); txt.textContent = "Feed stopped"; }
    else if (state.ended) { txt.textContent = state.meta.source === "replay" ? "Replay finished" : "Feed finished"; }
    else { el.classList.add("live"); txt.textContent = names[state.meta.source] || "Connected"; }
    const m = state.meta;
    $("foot").textContent = m.host
      ? `Served by ${m.host}. Each point summarises the last ${m.window} s, updated every ${m.interval} s. Times are in your local time zone.`
      : "";
  }

  function renderTabs() {
    const tabs = $("tabs"), products = Object.keys(state.data).sort();
    if (!state.active || !state.data[state.active]) state.active = products[0] || null;
    if (tabs.dataset.sig === products.join("|") + "#" + state.active) return;
    tabs.dataset.sig = products.join("|") + "#" + state.active;
    tabs.replaceChildren(...products.map(p => {
      const b = document.createElement("button");
      b.textContent = p;
      b.setAttribute("aria-pressed", p === state.active);
      b.onclick = () => { state.active = p; state.hoverT = null; renderAll(); };
      return b;
    }));
    document.title = state.active ? `${state.active} analytics` : "Market analytics";
  }

  // ---------- canvas ----------
  const canvas = $("chart"), ctx = canvas.getContext("2d");
  let geom = null;   // set by draw(); used by the pointer handlers

  const niceStep = (span, target) => {
    const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * mag;
  };
  const timeStep = span => [5, 10, 15, 30, 60, 120, 300, 600, 900].find(s => span / s <= 7) || 1800;

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    geom = null;
    const all = series();
    if (!all.length) return;

    const font = (px, weight = 400) => { ctx.font = `${weight} ${px}px ${C.font}`; };
    const narrow = W < 560;
    // The right margin holds price labels, so size it to the widest one
    // (this also keeps things tidy if the web font has not loaded).
    font(13, 600);
    const widest = Math.max(...all.slice(-600).map(s => ctx.measureText(fmtPrice(Math.max(s.last, s.vwap))).width),
                            ctx.measureText("+0.00 bp").width);
    const gut = Math.ceil(widest) + 18, x0 = 12, x1 = W - gut;
    const axisH = 24, stripH = narrow ? 50 : 60;
    const strips = [
      { key: "flow", label: "Order flow", kind: "bars" },
      { key: "book", label: "Book pressure", kind: "bars" },
      { key: "vol", label: "Volatility", kind: "area" },
      { key: "vpin", label: "Flow toxicity (VPIN)", kind: "unit" },
    ];
    const priceTop = 10, priceBot = H - axisH - strips.length * stripH - 8;

    const tMax = all[all.length - 1].t;
    let tMin = Math.max(tMax - state.range, all[0].t);
    if (tMax - tMin < 30) tMin = tMax - 30;
    const data = all.slice(lowerBound(all, tMin));
    const X = t => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
    geom = { x0, x1, tMin, tMax };

    ctx.textBaseline = "middle";

    // --- vertical time grid, shared by every row ---
    const tStep = timeStep(tMax - tMin);
    font(13); ctx.fillStyle = C.muted; ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
    ctx.textAlign = "center";
    for (let t = Math.ceil(tMin / tStep) * tStep; t <= tMax; t += tStep) {
      const x = Math.round(X(t)) + .5;
      ctx.globalAlpha = .6;
      ctx.beginPath(); ctx.moveTo(x, priceTop); ctx.lineTo(x, H - axisH); ctx.stroke();
      ctx.globalAlpha = 1;
      if (x > x0 + 24 && x < x1 - 20) ctx.fillText(fmtClock(t, tStep < 60), x, H - axisH / 2 + 1);
    }

    // --- price scale ---
    let lo = Infinity, hi = -Infinity;
    for (const s of data) {
      if (s.last > 0) { lo = Math.min(lo, s.last); hi = Math.max(hi, s.last); }
      if (s.vwap > 0) { lo = Math.min(lo, s.vwap); hi = Math.max(hi, s.vwap); }
    }
    if (!(hi > lo)) { const mid = hi > 0 ? hi : 1; lo = mid * .9995; hi = mid * 1.0005; }
    const pad = (hi - lo) * .1; lo -= pad; hi += pad;
    const Y = v => priceBot - (v - lo) / (hi - lo) * (priceBot - priceTop);

    const pStep = niceStep(hi - lo, narrow ? 4 : 6);
    const priceTicks = [];
    for (let v = Math.ceil(lo / pStep) * pStep; v < hi; v += pStep) {
      const y = Math.round(Y(v)) + .5;
      ctx.globalAlpha = .6;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.globalAlpha = 1;
      priceTicks.push([v, y]);
    }

    ctx.save();
    ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip();

    // --- shading between price and VWAP: the "price against VWAP" story ---
    ctx.globalAlpha = .18;
    for (let i = 1; i < data.length; i++) {
      const a = data[i - 1], b = data[i];
      if (!(a.vwap > 0 && b.vwap > 0)) continue;
      ctx.fillStyle = (a.last - a.vwap) + (b.last - b.vwap) >= 0 ? C.buy : C.sell;
      ctx.beginPath();
      ctx.moveTo(X(a.t), Y(a.last)); ctx.lineTo(X(b.t), Y(b.last));
      ctx.lineTo(X(b.t), Y(b.vwap)); ctx.lineTo(X(a.t), Y(a.vwap));
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const line = (key, color, width, dash = []) => {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.lineJoin = "round";
      ctx.beginPath();
      let started = false;
      for (const s of data) {
        if (!(s[key] > 0)) continue;
        if (started) ctx.lineTo(X(s.t), Y(s[key])); else { ctx.moveTo(X(s.t), Y(s[key])); started = true; }
      }
      ctx.stroke(); ctx.setLineDash([]);
    };
    line("vwap", C.vwap, 1.6, [6, 4]);
    line("last", C.ink, 1.7);

    // --- strips ---
    const barW = Math.max(1, (x1 - x0) * state.meta.interval / (tMax - tMin));
    strips.forEach((st, k) => {
      const top = priceBot + 8 + k * stripH, bot = top + stripH, inner = 7;
      st.top = top; st.bot = bot;
      if (st.kind === "bars") {
        const mid = (top + bot) / 2, half = stripH / 2 - inner;
        for (const s of data) {
          const v = Math.max(-1, Math.min(1, s[st.key]));
          ctx.fillStyle = v >= 0 ? C.buy : C.sell;
          ctx.globalAlpha = st.key === "book" ? .55 : .9;
          ctx.fillRect(X(s.t) - barW, v >= 0 ? mid - v * half : mid, Math.max(barW - (barW > 3 ? 1 : 0), 1), Math.abs(v) * half);
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, Math.round(mid) + .5); ctx.lineTo(x1, Math.round(mid) + .5); ctx.stroke();
      } else {
        const pts = st.kind === "unit" ? data.filter(s => s.vpin_n > 0) : data;
        const max = st.kind === "unit" ? 1 : Math.max(.2, ...pts.map(s => s[st.key])) * 1.15;
        const y = v => bot - 2 - Math.min(v / max, 1) * (stripH - inner - 2);
        if (pts.length > 1) {
          ctx.beginPath();
          pts.forEach((s, i) => i ? ctx.lineTo(X(s.t), y(s[st.key])) : ctx.moveTo(X(s.t), y(s[st.key])));
          ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.lineTo(X(pts[pts.length - 1].t), bot); ctx.lineTo(X(pts[0].t), bot); ctx.closePath();
          ctx.fillStyle = C.ink; ctx.globalAlpha = .12; ctx.fill(); ctx.globalAlpha = 1;
        } else if (st.kind === "unit") {
          font(13); ctx.fillStyle = C.muted; ctx.textAlign = "right";
          ctx.fillText("Starts once the first volume bucket fills", x1 - 8, (top + bot) / 2 + 6);
        }
      }
    });

    // --- hover line and marker ---
    const h = state.hoverT == null ? null : nearest(data, state.hoverT);
    if (h) {
      const x = Math.round(X(h.t)) + .5;
      ctx.strokeStyle = C.ink; ctx.globalAlpha = .55; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, priceTop); ctx.lineTo(x, H - axisH); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(X(h.t), Y(h.last), 3.5, 0, 7); ctx.fill();
    }
    ctx.restore();

    // --- strip frames, labels and current values (outside the clip) ---
    const cur = h || data[data.length - 1];
    strips.forEach(st => {
      ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, Math.round(st.top) + .5); ctx.lineTo(W, Math.round(st.top) + .5); ctx.stroke();
      font(13, 500); ctx.textAlign = "left"; ctx.fillStyle = C.muted;
      // A soft plate behind the label keeps it readable over the bars.
      const tw = ctx.measureText(st.label).width;
      ctx.fillStyle = C.panel; ctx.globalAlpha = .82;
      ctx.fillRect(x0, st.top + 3, tw + 10, 17); ctx.globalAlpha = 1;
      ctx.fillStyle = C.muted; ctx.fillText(st.label, x0 + 5, st.top + 12);

      const v = cur[st.key];
      let text = "–", color = C.ink;
      if (st.kind === "bars") { text = fmtSigned(v); color = v > 0 ? C.buy : v < 0 ? C.sell : C.ink; }
      else if (st.kind === "area") text = v.toFixed(2) + " bp";
      else if (cur.vpin_n > 0) text = v.toFixed(2);
      font(15, 600); ctx.fillStyle = color;
      ctx.fillText(text, x1 + 8, (st.top + st.bot) / 2 + 1);
    });
    ctx.strokeStyle = C.rule;
    ctx.beginPath(); ctx.moveTo(0, H - axisH + .5); ctx.lineTo(W, H - axisH + .5); ctx.stroke();

    // --- price and VWAP tags in the right margin ---
    const tag = (v, y, bg, fg) => {
      const t = fmtPrice(v); font(13, 600);
      ctx.fillStyle = bg; ctx.fillRect(x1 + 3, y - 10, gut - 5, 20);
      ctx.fillStyle = fg; ctx.textAlign = "left"; ctx.fillText(t, x1 + 8, y + 1);
    };
    let yl = cur.last > 0 ? Y(cur.last) : null, yv = cur.vwap > 0 ? Y(cur.vwap) : null;
    if (yl != null && yv != null && Math.abs(yl - yv) < 21) {
      const m = (yl + yv) / 2, up = yl <= yv ? -1 : 1; yl = m + up * 10.5; yv = m - up * 10.5;
    }
    font(13); ctx.fillStyle = C.muted; ctx.textAlign = "left";
    for (const [v, y] of priceTicks) {          // axis labels, except where a tag sits
      if ((yl != null && Math.abs(y - yl) < 18) || (yv != null && Math.abs(y - yv) < 18)) continue;
      ctx.fillText(fmtPrice(v), x1 + 8, y);
    }
    if (yv != null) tag(cur.vwap, yv, C.vwap, C.panel);
    if (yl != null) tag(cur.last, yl, C.ink, C.panel);
  }

  const renderAll = () => { renderTabs(); renderStatus(); renderPanels(); draw(); };

  // ---------- interaction ----------
  const pointerT = e => {
    if (!geom) return null;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left;
    const f = Math.max(0, Math.min(1, (x - geom.x0) / (geom.x1 - geom.x0)));
    return geom.tMin + f * (geom.tMax - geom.tMin);
  };
  canvas.addEventListener("pointermove", e => { state.hoverT = pointerT(e); renderPanels(); draw(); });
  canvas.addEventListener("pointerdown", e => { state.hoverT = pointerT(e); renderPanels(); draw(); });
  const clearHover = () => { if (state.hoverT != null) { state.hoverT = null; renderPanels(); draw(); } };
  canvas.addEventListener("pointerleave", clearHover);
  canvas.addEventListener("pointercancel", clearHover);

  $("ranges").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.range = +b.dataset.range;
    for (const x of $("ranges").children) x.setAttribute("aria-pressed", x === b);
    draw();
  });
  new ResizeObserver(draw).observe(canvas);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readTheme(); draw(); });

  // ---------- live connection ----------
  function connect() {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === "hello") {
        state.connected = true;
        state.meta = m; state.ended = m.ended; state.error = m.error;
        state.data = m.history || {};
        renderAll();
      } else if (m.type === "snap") {
        const arr = state.data[m.product] || (state.data[m.product] = []);
        arr.push(m.s);
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
        renderTabs();
        if (m.product === state.active) { renderPanels(); draw(); }
      } else if (m.type === "ended") {
        state.ended = true; state.error = m.error; renderStatus(); renderPanels();
      }
    };
    ws.onclose = () => { state.connected = false; renderStatus(); renderPanels(); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
  }
  renderAll();
  connect();
})();
</script>
</body>
</html>
